; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:cores3-lite]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_speed = 460800
build_flags = 
	-DESP32S3
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
lib_deps = 
	m5stack/M5Unified@0.2.23
	m5stack/M5GFX@0.2.30
	links2004/WebSockets@2.7.3
	bblanchon/ArduinoJson@7.4.2

; Offline bench for the talk (no credentials): memory, Wi-Fi visibility, mic/speaker behaviour.
;   python3 -m platformio run -e cores3-lite-bench -t upload
[env:cores3-lite-bench]
extends = env:cores3-lite
build_src_filter = -<*> +<../bench/>
